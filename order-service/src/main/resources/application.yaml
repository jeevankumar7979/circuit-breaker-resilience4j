spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

inventory:
  base-url: ${INVENTORY_BASE_URL:http://localhost:8082}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - beans
          - circuitbreakers
          - circuitbreaker-events
  endpoint:
    health:
      show-details: never
